[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepwiki"
version = "0.1.0"
description = "DeepWiki modular monorepo (core / api / pipeline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-groq",
  "langchain-anthropic",
  "langchain_community",
  "neo4j",
  "qdrant-client",
  "tree-sitter",
  "gitpython",
  "fastapi",
  "streamlit",
  "uvicorn",
  "python-dotenv",
  "tree-sitter-java",
  "sentence-transformers",
  "groq",
  "pandas",
  "anthropic",
  "torch",
  "javalang",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "import-linter>=2.0",
]

[tool.setuptools.packages.find]
include = ["core*", "api*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_packages = ["core", "api", "pipeline"]

[[tool.importlinter.contracts]]
name = "core is independent"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["api", "pipeline"]

[[tool.importlinter.contracts]]
name = "api and pipeline do not import each other"
type = "independence"
modules = ["api", "pipeline"]
